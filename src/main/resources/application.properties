spring.application.name=linkguard

# Supervision (TP4) : les endpoints Actuator écoutent sur un port de gestion séparé.
# Le conteneur ne publie que 8080 : seul Prometheus atteint 8081, depuis le réseau Docker.
management.server.port=8081
# Exposition minimale : health (état) et prometheus (mesures) ; env, heapdump, loggers... restent fermés.
management.endpoints.web.exposure.include=health,prometheus
