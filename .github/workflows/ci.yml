name: CI/CD - LinkGuard

# Déclencheurs : push sur main ou sur une branche feature/..., et pull request vers main
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

# Droits minimaux pour le jeton GitHub du pipeline
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/linkguard

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Sécurité 1 : détection de secrets dans les commits, avant toute compilation
      # Actions tierces épinglées par SHA complet (exigé par SonarQube Cloud) : un tag peut être déplacé, un SHA non
      - name: Scan des secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # Le rapport est publié même si Gitleaks a fait échouer le pipeline
      - name: Publier le rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: warn

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = tests + rapport de couverture JaCoCo (target/site/jacoco/jacoco.xml)
      - name: Compiler, tester et mesurer la couverture (Maven + JaCoCo)
        run: ./mvnw -B -ntp clean verify

      # Sécurité 2 : analyse statique du code (SAST) par SonarQube Cloud, avec Quality Gate bloquant.
      # Seulement sur les PR (contrôle avant le merge) et sur main : la première analyse d'une
      # nouvelle branche aurait un Quality Gate non calculé, que le scanner traite comme un échec.
      # Les secrets passent par env, jamais directement dans la commande (règle Sonar S7636).
      - name: Analyse SonarQube Cloud (Quality Gate)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true

      - name: Construire l'image Docker
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      # Sécurité 3 : scan de l'image (paquets de l'OS + bibliothèques Java du jar)
      # Action épinglée par SHA (v0.36.0) : en mars 2026, 76 tags de trivy-action
      # ont été détournés vers un malware voleur d'identifiants (CVE-2026-33634)
      - name: Rapport Trivy (toutes sévérités)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Publier le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn

      # Politique durcie : on bloque aussi MEDIUM, mais seulement ce qui a déjà un correctif
      # (ignore-unfixed) : une faille corrigeable qu'on laisse dans l'image est un choix, pas une fatalité
      - name: Politique Trivy (échec si MEDIUM+ corrigeable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Tester l'image (conteneur)
        run: |
          docker run -d --name linkguard-test -p 8080:8080 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8080/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://localhost:8080/ || { docker logs linkguard-test; exit 1; }
          curl -fsS -o /dev/null -w "GET /api/analyze -> %{http_code}\n" "http://localhost:8080/api/analyze?url=https://www.epi.tn"
          docker rm -f linkguard-test

      # Les deux étapes suivantes ne tournent que sur un push dans main (après merge de la PR)
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pousser l'image sur Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
